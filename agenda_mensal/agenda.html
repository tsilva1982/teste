<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Mensal por Blocos</title>
<style>
:root{--bg:#0b1120;--panel:#151f32;--cell:#1d2a40;--border:#30415b;--text:#e7edf7;--muted:#91a1b8;--blue:#2563eb;--purple:#8b5cf6}
*{box-sizing:border-box}
body{margin:0;padding:24px;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
.container{max-width:1800px;margin:auto}
header h1{margin:0 0 6px;font-size:27px}
header p{margin:0;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:24px 0}
button{border:0;border-radius:7px;padding:11px 15px;color:#fff;font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.15)}
.primary{background:var(--blue)}.secondary{background:#34445e}
.month{font-size:21px;font-weight:700;min-width:190px;text-align:center}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;overflow:auto}
.info{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:13px;margin-bottom:14px}
table{border-collapse:separate;border-spacing:2px;table-layout:fixed;min-width:1250px;width:100%}
th{position:sticky;top:0;z-index:2;background:#263852;color:white;padding:12px 4px;border-radius:5px;font-size:11px;white-space:nowrap}
th:first-child{left:0;z-index:4;width:125px}
th.block{background:#315477}
td{height:76px;padding:4px;background:var(--cell);border:1px solid var(--border);border-radius:5px;vertical-align:top}
td.date{position:sticky;left:0;z-index:1;width:125px;background:#263852;color:#dce8f8;font-weight:700;vertical-align:middle;text-align:center;font-size:12px}
td.slot{min-width:70px}
td.today{outline:2px solid var(--purple);outline-offset:-2px}
.event{display:block;border-radius:4px;padding:6px;margin:2px 0;font-size:11px;line-height:1.3;overflow-wrap:anywhere;color:#fff;background:#126b52}
.event small{display:block;font-size:9px;opacity:.95;margin-top:3px}
.status{margin-top:12px;color:var(--muted);font-size:12px}
.status.error{color:#ff9aa9}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px;background:#202d43;border:1px solid var(--border);padding:5px 8px;border-radius:6px;font-size:11px;color:#e7edf7}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
@media(max-width:600px){body{padding:12px}.month{font-size:18px;min-width:145px}}
@media print{
 body{background:white;color:black;padding:0}.toolbar{display:none}.panel{background:white;border:0;padding:0}
 table{min-width:0;width:100%;border-spacing:1px}
 th{background:#263852!important;color:white!important;print-color-adjust:exact;font-size:7px;padding:5px 1px}
 th:first-child,td.date{width:75px}
 td{height:55px;padding:2px}
 td.date{background:#263852!important;color:white!important;print-color-adjust:exact;font-size:7px}
 .event{font-size:6px;padding:2px;print-color-adjust:exact}.event small{font-size:5px}
 .legend span{print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>◈ Agenda Mensal por Blocos</h1>
  <p>Eventos com cores personalizadas definidas no arquivo agenda.csv.</p>
</header>
<div class="toolbar">
  <button class="secondary" id="prev">❮ Mês anterior</button>
  <div class="month" id="monthLabel"></div>
  <button class="secondary" id="next">Próximo mês ❯</button>
  <button class="primary" id="current">Mês atual</button>
  <button class="primary" id="reload">↻ Recarregar CSV</button>
  <button class="secondary" id="print">▣ Imprimir</button>
</div>
<section class="panel">
  <div class="info">
    <span>As cores identificam cada evento</span>
    <span>00–07 e 19–24 são blocos únicos</span>
    <span id="count">0 eventos</span>
  </div>
  <div id="grid"></div>
  <div id="legend" class="legend"></div>
  <div id="status" class="status" role="status">Carregando agenda.csv...</div>
</section>
</div>
<script>
"use strict";
const monthNames=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const today=new Date();
let year=today.getFullYear(),month=today.getMonth(),events=[];
const $=id=>document.getElementById(id);
const slots=[
 {start:0,end:7,label:"00–07"},
 ...Array.from({length:12},(_,i)=>({start:i+7,end:i+8,label:String(i+7).padStart(2,"0")+"–"+String(i+8).padStart(2,"0")})),
 {start:19,end:24,label:"19–24"}
];
const defaultColor="#126b52";

function setStatus(msg,error=false){$("status").textContent=msg;$("status").classList.toggle("error",error)}
function parseCSV(text){
 const rows=[];let row=[],field="",quoted=false;
 for(let i=0;i<text.length;i++){
  const c=text[i],n=text[i+1];
  if(c==='"'&&quoted&&n==='"'){field+='"';i++}
  else if(c==='"')quoted=!quoted;
  else if(c===';'&&!quoted){row.push(field);field=""}
  else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(field);field="";if(row.some(v=>v.trim()))rows.push(row);row=[]}
  else field+=c;
 }
 row.push(field);if(row.some(v=>v.trim()))rows.push(row);return rows;
}
function validDate(s){
 const m=(s||"").trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return false;
 const d=new Date(+m[1],+m[2]-1,+m[3]);
 return d.getFullYear()===+m[1]&&d.getMonth()===+m[2]-1&&d.getDate()===+m[3];
}
function parseHour(s){
 const v=(s||"").trim();
 if(!/^(?:[01]?\d|2[0-4])(?::00)?$/.test(v))return null;
 const n=Number(v.split(":")[0]);return n<=24?n:null;
}
function validColor(value){
 const v=(value||"").trim();
 return /^#[0-9a-fA-F]{6}$/.test(v)?v:defaultColor;
}
async function loadCSV(){
 setStatus("Lendo agenda.csv...");
 try{
  const response=await fetch("./agenda.csv?ts="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw new Error("Não foi possível acessar agenda.csv (HTTP "+response.status+").");
  const rows=parseCSV((await response.text()).replace(/^\uFEFF/,""));
  if(!rows.length)throw new Error("O arquivo agenda.csv está vazio.");
  const headers=rows.shift().map(v=>v.trim().toLowerCase());
  const di=headers.indexOf("data"),si=headers.indexOf("inicio"),ei=headers.indexOf("fim"),ai=headers.indexOf("atividade"),xi=headers.indexOf("descricao"),ci=headers.indexOf("cor");
  if([di,si,ei,ai].some(i=>i<0))throw new Error("Cabeçalho esperado: data;inicio;fim;atividade;descricao;cor");
  const loaded=[];let ignored=0;
  rows.forEach((r,index)=>{
   const date=(r[di]||"").trim(),start=parseHour(r[si]),end=parseHour(r[ei]);
   const name=(r[ai]||"").trim(),description=xi>=0?(r[xi]||"").trim():"";
   const slot=slots.find(s=>s.start===start&&s.end===end);
   if(!validDate(date)||start===null||end===null||!slot||!name){ignored++;return}
   const color=ci>=0?validColor(r[ci]):defaultColor;
   loaded.push({date,start,end,label:slot.label,name,description,color});
  });
  events=loaded;render();
  setStatus(`CSV atualizado: ${events.length} evento(s) carregado(s).`+(ignored?` ${ignored} linha(s) ignorada(s): confira datas, horários e atividades.`:""));
 }catch(e){setStatus(e.message+" Abra pelo iniciar.bat e mantenha agenda.csv na mesma pasta.",true)}
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
 $("monthLabel").textContent=monthNames[month]+" / "+year;
 const days=new Date(year,month+1,0).getDate();
 let html='<table><thead><tr><th>DATA</th>';
 slots.forEach((s,i)=>html+=`<th class="${i===0||i===slots.length-1?"block":""}">${s.label}</th>`);
 html+='</tr></thead><tbody>';
 let total=0;const colors=new Map();
 for(let d=1;d<=days;d++){
  const date=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const weekday=new Intl.DateTimeFormat("pt-BR",{weekday:"short"}).format(new Date(year,month,d));
  const isToday=year===today.getFullYear()&&month===today.getMonth()&&d===today.getDate();
  html+=`<tr><td class="date">${String(d).padStart(2,"0")}/${String(month+1).padStart(2,"0")}/${year}<br>${weekday}</td>`;
  slots.forEach(slot=>{
   const matching=events.filter(e=>e.date===date&&e.start===slot.start&&e.end===slot.end);
   total+=matching.length;
   html+=`<td class="slot${isToday?" today":""}">`;
   matching.forEach(e=>{
    colors.set(e.name+"|"+e.color,{name:e.name,color:e.color});
    html+=`<div class="event" style="background-color:${e.color}"><strong>${esc(e.name)}</strong><small>${esc(slot.label)}${e.description?" · "+esc(e.description):""}</small></div>`;
   });
   html+='</td>';
  });
  html+='</tr>';
 }
 html+='</tbody></table>';
 $("grid").innerHTML=html;
 $("count").textContent=`${total} evento(s) neste mês`;
 $("legend").innerHTML=[...colors.values()].map(x=>`<span><i class="dot" style="background:${x.color}"></i>${esc(x.name)}</span>`).join("");
}
$("prev").onclick=()=>{month--;if(month<0){month=11;year--}render()};
$("next").onclick=()=>{month++;if(month>11){month=0;year++}render()};
$("current").onclick=()=>{year=today.getFullYear();month=today.getMonth();render()};
$("reload").onclick=loadCSV;
$("print").onclick=()=>window.print();
loadCSV();
</script>
</body>
</html>
