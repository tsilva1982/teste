<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda Mensal</title>
<style>
:root{--bg:#08111f;--panel:#101c2d;--line:#26364d;--text:#e8eef7;--muted:#91a2b9;--accent:#4f8cff;--holiday:#9f303f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif}
header{padding:22px 26px 14px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:24px;margin:0 0 5px}.subtitle{font-size:13px;color:var(--muted)}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{border:1px solid var(--line);background:#142238;color:var(--text);padding:9px 13px;border-radius:9px;cursor:pointer;font-weight:650}
button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:white}.month-label{font-weight:750;min-width:155px;text-align:center;text-transform:capitalize}
main{padding:8px 18px 24px}.statusbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 4px 12px;color:var(--muted);font-size:12px}
.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.legend-item{display:flex;align-items:center;gap:6px}.swatch{width:11px;height:11px;border-radius:3px;background:var(--holiday)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1320px;table-layout:fixed}
thead th{position:sticky;top:0;z-index:2;background:#17263b;color:#b9c8dc;font-size:11px;padding:12px 5px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center}
thead th:first-child{left:0;z-index:4;width:142px}
tbody th.date-cell{position:sticky;left:0;z-index:1;background:#122036;text-align:left;width:142px;padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.date-number{font-size:15px;font-weight:800;display:block}.weekday{font-size:11px;color:var(--muted);text-transform:capitalize;display:block;margin-top:2px}
.holiday-name{font-size:10px;line-height:1.25;margin-top:5px;font-weight:750;display:block;overflow-wrap:anywhere}
tbody th.date-cell.is-holiday{background:var(--holiday);color:white}tbody th.date-cell.is-holiday .weekday{color:#ffe0e4}
tbody td{height:76px;vertical-align:top;padding:5px;border-right:1px solid #223148;border-bottom:1px solid #223148;background:#0e1a2a}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}tbody td:last-child,thead th:last-child{border-right:0}
.event{border-radius:6px;padding:5px 6px;margin:0 0 4px;color:white;font-size:10px;line-height:1.25;overflow-wrap:anywhere}
.event strong{display:block;font-size:10px;margin-bottom:2px}.event small{display:block;font-size:9px;opacity:.9}
.empty-day{color:#52647c;font-size:10px;text-align:center;padding-top:12px}footer{color:var(--muted);font-size:11px;text-align:center;padding:12px}
@media(max-width:700px){header{padding:16px}main{padding:6px 10px 18px}h1{font-size:20px}}
@media print{body{background:white;color:#111}.controls,.reload{display:none}header{padding:8px}main{padding:0}.table-wrap{overflow:visible}table{min-width:0}thead th{position:static;background:#eee;color:#111}tbody th.date-cell{position:static;background:#f4f4f4;color:#111}tbody th.date-cell.is-holiday{background:#9f303f!important;color:white!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}tbody td{height:58px;background:white}.event{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head>
<body>
<header><div><h1>Agenda Mensal</h1><div class="subtitle">Visualização mensal de compromissos e feriados</div></div>
<div class="controls"><button id="prevMonth">‹</button><div class="month-label" id="monthLabel"></div><button id="nextMonth">›</button><button id="todayBtn">Hoje</button><button class="primary" id="reloadBtn">↻ Recarregar CSV</button><button id="printBtn">Imprimir</button></div></header>
<main><div class="statusbar"><div id="status">Carregando agenda...</div><div class="legend"><span class="legend-item"><span class="swatch"></span>Feriado</span><span id="eventLegend"></span></div></div>
<div class="table-wrap"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div></main>
<footer>Agenda Mensal • Dados carregados de agenda.csv e feriados.csv</footer>
<script>
const slots=[{start:'00',end:'07',label:'00–07'},...Array.from({length:12},(_,i)=>({start:String(i+7).padStart(2,'0'),end:String(i+8).padStart(2,'0'),label:`${String(i+7).padStart(2,'0')}–${String(i+8).padStart(2,'0')}`})),{start:'19',end:'24',label:'19–24'}];
const $=id=>document.getElementById(id);let currentMonth=new Date();currentMonth.setDate(1);let events=[],holidays=[];
const weekdays=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function parseCSV(text){text=String(text??'').replace(/^﻿/,'');const first=text.split(/\r?\n/).find(x=>x.trim())||'';let delim=';',best=-1;for(const d of [';',',','\t']){let n=first.split(d).length;if(n>best){best=n;delim=d;}}
let rows=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){let ch=text[i],nx=text[i+1];if(ch==='"'&&quoted&&nx==='"'){field+='"';i++;}else if(ch==='"')quoted=!quoted;else if(ch===delim&&!quoted){row.push(field.trim());field='';}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&nx==='\n')i++;row.push(field.trim());if(row.some(x=>x!==''))rows.push(row);row=[];field='';}else field+=ch;}row.push(field.trim());if(row.some(x=>x!==''))rows.push(row);if(rows.length<2)return [];
const norm=s=>String(s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const heads=rows.shift().map(norm);return rows.map(vals=>Object.fromEntries(heads.map((h,i)=>[h,(vals[i]??'').trim()])));}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(String(s))&&!Number.isNaN(new Date(s+'T12:00:00').getTime());}
function color(c){return /^#[0-9a-f]{6}$/i.test(String(c||''))?c:'#126b52';}
function render(){const y=currentMonth.getFullYear(),m=currentMonth.getMonth(),days=new Date(y,m+1,0).getDate();$('monthLabel').textContent=currentMonth.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
const hm=new Map(holidays.map(h=>[h.data,h]));let html='';for(let d=1;d<=days;d++){const date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,dt=new Date(y,m,d),h=hm.get(date);
html+=`<tr><th class="date-cell ${h?'is-holiday':''}" ${h?`title="${esc(h.descricao)}"`:''}><span class="date-number">${String(d).padStart(2,'0')}/${String(m+1).padStart(2,'0')}/${y}</span><span class="weekday">${weekdays[dt.getDay()]}</span>${h?`<span class="holiday-name">${esc(h.descricao)}${h.tipo?' · '+esc(h.tipo):''}</span>`:''}</th>`;
for(const s of slots){const list=events.filter(e=>e.data===date&&e.inicio===s.start&&e.fim===s.end);html+='<td>'+(list.length?list.map(e=>`<div class="event" style="background:${color(e.cor)}"><strong>${esc(e.atividade)}</strong>${e.descricao?`<small>${esc(e.descricao)}</small>`:''}</div>`).join(''):'<div class="empty-day">—</div>')+'</td>';}html+='</tr>';}
$('tableBody').innerHTML=html;}
async function loadCSV(file){const r=await fetch(`./${file}?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`${file}: HTTP ${r.status}`);return parseCSV(await r.text());}
async function reload(){ $('reloadBtn').disabled=true;$('status').textContent='Atualizando agenda e feriados...';try{const [a,h]=await Promise.all([loadCSV('agenda.csv'),loadCSV('feriados.csv')]);events=a.filter(r=>validDate(r.data)).map(r=>({data:r.data,inicio:String(r.inicio||'').padStart(2,'0'),fim:String(r.fim||'').padStart(2,'0'),atividade:r.atividade||'Atividade',descricao:r.descricao||'',cor:color(r.cor)}));holidays=h.filter(r=>validDate(r.data)).map(r=>({data:r.data,descricao:r.descricao||'Feriado',tipo:r.tipo||'',cor:color(r.cor)}));$('status').textContent=`${events.length} compromisso(s) e ${holidays.length} feriado(s) carregados.`;render();}catch(e){$('status').textContent=`Falha ao carregar: ${e.message}. Deixe os dois CSVs na mesma pasta do index.html.`;render();}finally{$('reloadBtn').disabled=false;}}
$('tableHead').innerHTML='<tr><th>DATA</th>'+slots.map(s=>`<th>${s.label}</th>`).join('')+'</tr>';
$('prevMonth').onclick=()=>{currentMonth.setMonth(currentMonth.getMonth()-1);render();};$('nextMonth').onclick=()=>{currentMonth.setMonth(currentMonth.getMonth()+1);render();};$('todayBtn').onclick=()=>{currentMonth=new Date();currentMonth.setDate(1);render();};$('reloadBtn').onclick=reload;$('printBtn').onclick=()=>window.print();reload();
</script></body></html>
