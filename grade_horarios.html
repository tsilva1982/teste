
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Semanal</title>

<style>
:root {
    --bg: #0b1120;
    --panel: #151f32;
    --panel2: #1d2a40;
    --border: #30415b;
    --text: #e7edf7;
    --muted: #91a1b8;
    --blue: #2563eb;
    --green: #16a36a;
    --red: #dc4c64;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 25px;
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

header {
    margin-bottom: 25px;
}

header h1 {
    margin: 0;
    font-size: 27px;
    color: #ffffff;
}

header p {
    color: var(--muted);
    margin-top: 7px;
}

.container {
    max-width: 1600px;
    margin: auto;
}

.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 11px 17px;
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    filter: brightness(1.2);
    transform: translateY(-1px);
}

.primary { background: var(--blue); }
.success { background: var(--green); }
.danger { background: var(--red); }
.secondary { background: #34445e; }

.panel {
    background: var(--panel);
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: 13px;
    overflow-x: auto;
}

.info {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 15px;
    color: var(--muted);
    font-size: 13px;
}

table {
    width: 100%;
    min-width: 950px;
    border-collapse: separate;
    border-spacing: 3px;
    table-layout: fixed;
}

th {
    background: #243550;
    color: #fff;
    padding: 14px 5px;
    border-radius: 6px;
    font-size: 13px;
}

th:first-child {
    width: 85px;
}

td {
    background: var(--panel2);
    border: 1px solid var(--border);
    text-align: center;
    height: 43px;
    padding: 5px;
    border-radius: 5px;
    font-size: 11px;
}

td.hora {
    background: #26354d;
    color: #aebed3;
    font-weight: bold;
}

td.celula {
    cursor: pointer;
    transition: .2s;
    color: #dce9fa;
}

td.celula:hover {
    background: #304b70;
    border-color: #60a5fa;
}

td.preenchido {
    background: #164c46;
    border-color: #238b70;
    color: #c3fff0;
    font-weight: 600;
}

td.preenchido:hover {
    background: #20665c;
}

.footer {
    margin-top: 15px;
    color: var(--muted);
    font-size: 12px;
    text-align: right;
}

/* Modal */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: #000b;
    justify-content: center;
    align-items: center;
    padding: 15px;
    z-index: 10;
}

.modal-content {
    width: 100%;
    max-width: 420px;
    background: #19263b;
    border: 1px solid var(--border);
    padding: 24px;
    border-radius: 13px;
}

.modal-content h2 {
    margin-top: 0;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px;
    background: #0e192b;
    border: 1px solid var(--border);
    border-radius: 7px;
    color: white;
    font-family: inherit;
}

textarea {
    resize: vertical;
    min-height: 75px;
}

.modal-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

@media(max-width:600px) {
    body { padding: 12px; }
    header h1 { font-size: 22px; }
    .panel { padding: 8px; }
}

@media print {
    body { background: white; color: black; padding: 0; }
    .toolbar, .footer, .modal { display: none !important; }
    .panel { background: white; border: 0; }
    th { background: #243550 !important; print-color-adjust: exact; }
    td { color: black; }
    td.hora { background: #ddd !important; }
    td.preenchido { background: #d0e8df !important; print-color-adjust: exact; }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>◈ Agenda Semanal</h1>
    <p>Gerenciamento de horários e atividades da semana</p>
</header>

<div class="toolbar">
    <button class="primary" onclick="novoCompromisso()">
        ＋ Novo compromisso
    </button>

    <button class="success" onclick="window.print()">
        ▣ Imprimir
    </button>

    <button class="secondary" onclick="exportar()">
        ↓ Exportar dados
    </button>

    <button class="danger" onclick="limparGrade()">
        ✕ Limpar agenda
    </button>
</div>

<div class="panel">

    <div class="info">
        <span>● Verde: horário ocupado</span>
        <span id="contador">0 compromissos cadastrados</span>
    </div>

    <table id="grade">
        <thead>
            <tr>
                <th>HORÁRIO</th>
                <th>SEGUNDA</th>
                <th>TERÇA</th>
                <th>QUARTA</th>
                <th>QUINTA</th>
                <th>SEXTA</th>
                <th>SÁBADO</th>
                <th>DOMINGO</th>
            </tr>
        </thead>
        <tbody id="corpoGrade"></tbody>
    </table>

    <div class="footer">
        Clique em qualquer horário para cadastrar ou editar.
    </div>

</div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h2 id="tituloModal">Novo compromisso</h2>

        <label>Atividade</label>
        <input id="atividade" placeholder="Ex: Reunião, trabalho...">

        <label>Descrição</label>
        <textarea id="descricao" placeholder="Detalhes do compromisso"></textarea>

        <div class="modal-buttons">
            <button class="primary" onclick="salvar()">Salvar</button>
            <button class="danger" onclick="excluir()">Excluir</button>
            <button class="secondary" onclick="fechar()">Cancelar</button>
        </div>
    </div>
</div>

<script>

const dias = [
    "Segunda", "Terça", "Quarta",
    "Quinta", "Sexta", "Sábado", "Domingo"
];

let dados = JSON.parse(localStorage.getItem("agendaSemanal") || "{}");
let selecionado = null;

const corpo = document.getElementById("corpoGrade");

for (let h = 0; h < 24; h++) {

    const inicio = String(h).padStart(2,"0");
    const fim = String(h+1).padStart(2,"0");

    let tr = document.createElement("tr");

    let hora = document.createElement("td");
    hora.className = "hora";
    hora.textContent = inicio + " - " + fim;
    tr.appendChild(hora);

    dias.forEach((dia,d) => {

        let td = document.createElement("td");
        td.className = "celula";
        td.dataset.id = h + "-" + d;

        td.onclick = () => abrir(td.dataset.id);

        tr.appendChild(td);

    });

    corpo.appendChild(tr);
}

function abrir(id) {

    selecionado = id;

    let item = dados[id] || {};

    document.getElementById("atividade").value = item.nome || "";
    document.getElementById("descricao").value = item.descricao || "";

    document.getElementById("tituloModal").textContent =
        "Editar compromisso";

    document.getElementById("modal").style.display = "flex";
}

function novoCompromisso() {
    abrir("8-0");
    document.getElementById("atividade").value = "";
    document.getElementById("descricao").value = "";
    document.getElementById("tituloModal").textContent =
        "Novo compromisso (inicialmente segunda-feira, 08h)";
}

function salvar() {

    let nome = document.getElementById("atividade").value.trim();
    let descricao = document.getElementById("descricao").value.trim();

    if (!nome) {
        alert("Informe o nome da atividade.");
        return;
    }

    dados[selecionado] = {nome, descricao};

    persistir();
    fechar();
}

function excluir() {

    if (!selecionado || !dados[selecionado]) {
        fechar();
        return;
    }

    if (!confirm("Deseja excluir este compromisso?")) return;

    delete dados[selecionado];

    persistir();
    fechar();
}

function fechar() {
    document.getElementById("modal").style.display = "none";
}

function persistir() {

    localStorage.setItem("agendaSemanal", JSON.stringify(dados));
    atualizar();
}

function atualizar() {

    document.querySelectorAll(".celula").forEach(td => {

        let item = dados[td.dataset.id];

        td.textContent = item ? item.nome : "";
        td.classList.toggle("preenchido", !!item);

        td.title = item ? item.descricao : "";

    });

    let total = Object.keys(dados).length;

    document.getElementById("contador").textContent =
        total + (total === 1 ? " compromisso cadastrado" : " compromissos cadastrados");
}

function limparGrade() {

    if (!confirm("Deseja apagar todos os compromissos?")) return;

    dados = {};
    persistir();
}

function exportar() {

    let blob = new Blob(
        [JSON.stringify(dados,null,2)],
        {type:"application/json"}
    );

    let link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "agenda-semanal.json";
    link.click();
    URL.revokeObjectURL(link.href);
}

atualizar();

</script>

</body>
</html>
